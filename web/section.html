<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyên mục – Tin Kinh Tế</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css">
<link rel="stylesheet" href="news.css">
</head>
<body>
<div id="app" v-cloak>
  <site-header :active="K"></site-header>

  <main class="wrap">
    <div class="sechead" ref="head">
      <h1>{{ heading }}</h1>
      <p-tag v-if="!loading && !failed" :value="hits.length + ' tin'" severity="secondary" rounded></p-tag>
      <p-button v-if="SYM" as="a" href="board.html" label="Xem bảng giá" icon="pi pi-chart-line" size="small" outlined></p-button>
      <p-button v-if="SYM" as="a" :href="'docs.html?sym=' + SYM" label="Báo cáo tài chính" icon="pi pi-file-pdf" size="small" outlined></p-button>
      <p-iconfield v-if="!SYM" class="find">
        <p-inputicon class="pi pi-search"></p-inputicon>
        <p-inputtext v-model="q" placeholder="Tìm trong chuyên mục…" aria-label="Tìm tin" fluid size="small"></p-inputtext>
        <p-inputicon v-if="q" class="pi pi-times clear" role="button" aria-label="Xoá tìm kiếm" @click="q = ''"></p-inputicon>
      </p-iconfield>
    </div>

    <p-message v-if="failed" severity="error" class="msg">Không tải được tin: {{ failed }}</p-message>

    <template v-else-if="loading">
      <div class="sectop">
        <div><p-skeleton height="0" class="ratio"></p-skeleton><p-skeleton height="2rem" class="mt"></p-skeleton></div>
        <div class="stack"><div v-for="i in 2" :key="i"><p-skeleton height="0" class="ratio"></p-skeleton><p-skeleton height="1.2rem" class="mt"></p-skeleton></div></div>
      </div>
      <div class="stream"><div v-for="i in 4" :key="i" class="item"><p-skeleton height="1rem"></p-skeleton><p-skeleton height="3.5rem"></p-skeleton><p-skeleton height="0" class="ratio"></p-skeleton></div></div>
    </template>

    <template v-else>
      <!-- Page 1 of a section spends its first 3 stories on the lead block. -->
      <div v-if="lead" class="sectop cols">
        <story-card :a="list[0]" :cat="K" kind="lead" img></story-card>
        <div class="stack"><story-card v-for="a in list.slice(1, 3)" :key="a.url" :a="a" :cat="K" kind="small" img></story-card></div>
      </div>

      <h2 class="label" style="margin-top:28px">{{ q ? 'Kết quả tìm “' + q + '”' : 'Mới nhất' }}</h2>
      <div class="stream">
        <a v-for="a in shown" :key="a.url" class="item" :href="link(a, K)">
          <div class="meta">{{ ago(a.time) }}</div>
          <div><h3>{{ a.title }}</h3><p>{{ a.sapo }}</p><sym-tags :syms="a.syms"></sym-tags></div>
          <img v-if="a.img" :src="a.img" alt="" loading="lazy"><span v-else></span>
        </a>
        <p-message v-if="!shown.length" severity="secondary" variant="simple" class="msg">
          {{ SYM ? 'Chưa có tin nào nhắc tới ' + SYM + ' gần đây.' : 'Không có tin nào khớp “' + q + '”.' }}
        </p-message>
      </div>

      <p-paginator v-if="hits.length > PER" class="pager" :rows="PER" :total-records="hits.length" :first="(page - 1) * PER"
                   :page-link-size="5" template="FirstPageLink PrevPageLink PageLinks NextPageLink LastPageLink"
                   @page="go($event.page + 1)"></p-paginator>
    </template>
  </main>

  <site-footer></site-footer>
  <fresh-news :load="load" :urls="list.map((a) => a.url)"></fresh-news>
</div>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/primevue@4.5.5/umd/primevue.min.js"></script>
<script src="https://unpkg.com/@primeuix/themes@1.2.5/umd/aura.js"></script>
<script src="ui.js"></script>
<script>
createPage({
  setup() {
    // ?sym=HPG lists every category's news about one ticker; otherwise ?cat= is a section.
    const SYM = qs('sym').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const K = validCat(qs('cat')) || (SYM ? '' : CATS[0][0]);
    const heading = SYM ? 'Tin về ' + SYM : catName(K);
    document.title = heading + ' – ' + SITE;

    const PER = 10;
    const list = ref([]);
    const loading = ref(true);
    const failed = ref('');
    const q = ref(qs('q'));
    const page = ref(Math.max(1, parseInt(qs('page')) || 1));
    const head = ref(null);
    const load = () => (SYM ? getJSON('/api/news?sym=' + SYM) : getNews(K));

    const hits = computed(() => {
      const words = fold(q.value).split(/\s+/).filter(Boolean);
      return words.length ? list.value.filter((a) => words.every((w) => fold(a.title + ' ' + a.sapo).includes(w))) : list.value;
    });
    const lead = computed(() => !SYM && !q.value && page.value === 1 && list.value.length > 3);
    const shown = computed(() => {
      const s = hits.value.slice((page.value - 1) * PER, page.value * PER);
      return lead.value ? s.slice(3) : s;
    });

    // Keep page + query in the URL so coming back from an article lands on the same view.
    const sync = () => {
      const u = new URL(location);
      page.value > 1 ? u.searchParams.set('page', page.value) : u.searchParams.delete('page');
      q.value ? u.searchParams.set('q', q.value) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    };
    const go = (n) => { page.value = n; sync(); head.value.scrollIntoView({ behavior: 'smooth' }); };
    Vue.watch(q, () => { page.value = 1; sync(); });

    onMounted(async () => {
      try {
        list.value = await load();
        const pages = Math.max(1, Math.ceil(hits.value.length / PER));
        if (page.value > pages) { page.value = pages; sync(); }
      } catch (e) {
        failed.value = e.message;
      }
      loading.value = false;
    });

    return { SYM, K, heading, PER, list, loading, failed, q, page, head, hits, lead, shown, go, load, ago, link };
  },
});
</script>
</body>
</html>
